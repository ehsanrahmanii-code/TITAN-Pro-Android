<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050816">
<title>TITAN Pro</title>
<style>
:root{--bg:#050816;--bg2:#0b1224;--a:#22d3ee;--b:#a78bfa;--up:#22e5a0;--dn:#ff5d7a;--tx:#e8ecff;--mu:#8e98c9;--gl:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--tx);min-height:100vh;padding:12px;padding-bottom:80px}
.header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{width:44px;height:44px;border-radius:12px;background:#0b1224;border:1px solid #22d3ee44;display:grid;place-items:center;font-weight:800;color:var(--a);font-size:20px;box-shadow:0 0 20px #22d3ee33}
h1{font-size:18px}h1 span{color:var(--a);font-size:12px;display:block;font-weight:400}
.badge{margin-inline-start:auto;background:var(--gl);border:1px solid #ffffff18;border-radius:999px;padding:6px 12px;font-size:11px;color:var(--mu)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.tab{border:1px solid #ffffff18;background:var(--gl);color:var(--tx);border-radius:999px;padding:8px 14px;font-size:12px}
.tab.on{border-color:var(--a);color:var(--a)}
.card{background:rgba(255,255,255,.06);border:1px solid #ffffff14;border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sym{font-weight:700;font-size:15px}.name{color:var(--mu);font-size:11px}
.price{font-size:15px}.chg{font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px}
.chg.up{color:var(--up);background:#22e5a018}.chg.dn{color:var(--dn);background:#ff5d7a18}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid}
.tag.LONG{color:var(--up);border-color:#22e5a055;background:#22e5a015}
.tag.SHORT{color:var(--dn);border-color:#ff5d7a55;background:#ff5d7a15}
.tag.WAIT{color:#fbbf24;border-color:#fbbf2455;background:#fbbf2415}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi .card{text-align:center;padding:12px 8px;margin:0}
.kpi b{display:block;font-size:18px;color:var(--a)}.kpi span{font-size:11px;color:var(--mu)}
.bar{height:6px;background:#ffffff12;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:99px}
.sub{font-size:12px;color:var(--mu);line-height:1.6}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:14px;font-weight:700;color:#04101a;background:linear-gradient(90deg,var(--a),var(--b));margin-top:8px}
.footer{position:fixed;bottom:0;left:0;right:0;background:#050816ee;border-top:1px solid #ffffff12;padding:10px 14px;font-size:11px;color:var(--mu);text-align:center}
.loading{text-align:center;padding:40px 16px;color:var(--mu)}
.spin{width:28px;height:28px;border:3px solid #ffffff22;border-top-color:var(--a);border-radius:50%;margin:0 auto 12px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.price-lg{font-size:28px;font-weight:800;margin:6px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{background:#ffffff08;border-radius:12px;padding:10px;font-size:12px}
.mini b{display:block;font-size:14px;margin-top:4px}
</style>
</head>
<body>
<div class="header">
  <div class="logo">T</div>
  <h1>TITAN Pro <span>تحلیل زنده · بدون سفارش</span></h1>
  <div class="badge" id="clock">—</div>
</div>
<div class="kpi">
  <div class="card"><b id="kLong">0</b><span>LONG</span></div>
  <div class="card"><b id="kShort">0</b><span>SHORT</span></div>
  <div class="card"><b id="kWait">0</b><span>WAIT</span></div>
</div>
<div class="tabs" id="tabs">
  <button class="tab on" data-f="ALL">همه</button>
  <button class="tab" data-f="LONG">LONG</button>
  <button class="tab" data-f="SHORT">SHORT</button>
  <button class="tab" data-f="WAIT">WAIT</button>
</div>
<div id="list"><div class="loading"><div class="spin"></div>در حال دریافت قیمت از Binance…</div></div>
<div id="detail" style="display:none"></div>
<button class="btn" id="refresh">به‌روزرسانی بازار</button>
<div class="footer">TITAN Pro V75 · فقط تحلیل · Binance Public API · سفارش واقعی غیرفعال</div>
<script>
var COINS=[["BTCUSDT","BTC","Bitcoin"],["ETHUSDT","ETH","Ethereum"],["BNBUSDT","BNB","BNB"],["XRPUSDT","XRP","XRP"],["SOLUSDT","SOL","Solana"],["ADAUSDT","ADA","Cardano"],["DOGEUSDT","DOGE","Dogecoin"],["AVAXUSDT","AVAX","Avalanche"],["LINKUSDT","LINK","Chainlink"],["NEARUSDT","NEAR","NEAR"],["SUIUSDT","SUI","Sui"],["AAVEUSDT","AAVE","Aave"],["BCHUSDT","BCH","Bitcoin Cash"],["XLMUSDT","XLM","Stellar"],["TRXUSDT","TRX","TRON"],["SHIBUSDT","SHIB","Shiba Inu"],["PEPEUSDT","PEPE","Pepe"],["WIFUSDT","WIF","dogwifhat"],["DOTUSDT","DOT","Polkadot"],["LTCUSDT","LTC","Litecoin"],["UNIUSDT","UNI","Uniswap"],["ATOMUSDT","ATOM","Cosmos"],["APTUSDT","APT","Aptos"],["ARBUSDT","ARB","Arbitrum"]];
var ROWS=[], FILT="ALL", SEL=null;
function pf(v){v=+v;if(!isFinite(v))return"—";if(v>=1000)return v.toLocaleString("en",{maximumFractionDigits:2});if(v>=1)return v.toFixed(4);return v.toFixed(6)}
function scoreRow(t){
  var ch=+t.priceChangePercent||0, last=+t.lastPrice||0, high=+t.highPrice||0, low=+t.lowPrice||0;
  var range=high-low||1e-12, pos=(last-low)/range;
  var conf=50+Math.max(-18,Math.min(18,ch*1.8));
  conf+=(pos-0.5)*16;
  conf=Math.max(8,Math.min(92,conf));
  var decision="WAIT";
  if(ch>1.2&&pos>0.55)decision="LONG";
  else if(ch<-1.2&&pos<0.45)decision="SHORT";
  else if(ch>2.5)decision="LONG";
  else if(ch<-2.5)decision="SHORT";
  var score=Math.round(50+ch*2+(pos-0.5)*20);
  return{decision:decision,conf:Math.round(conf),score:Math.max(1,Math.min(99,score)),ch:ch,last:last,high:high,low:low};
}
function load(){
  document.getElementById("list").innerHTML='<div class="loading"><div class="spin"></div>در حال دریافت قیمت از Binance…</div>';
  fetch("https://data-api.binance.vision/api/v3/ticker/24hr",{cache:"no-store"}).then(function(r){return r.json()}).then(function(all){
    var map={}; for(var i=0;i<all.length;i++) map[all[i].symbol]=all[i];
    ROWS=[];
    for(var j=0;j<COINS.length;j++){
      var c=COINS[j], t=map[c[0]]||{}, s=scoreRow(t);
      ROWS.push({sym:c[0],base:c[1],name:c[2],decision:s.decision,conf:s.conf,score:s.score,ch:s.ch,last:s.last,high:s.high,low:s.low});
    }
    ROWS.sort(function(a,b){return b.conf-a.conf});
    render();
  }).catch(function(){
    document.getElementById("list").innerHTML='<div class="card sub">خطا در اتصال به Binance. اینترنت را چک کنید.</div>';
  });
  document.getElementById("clock").textContent=new Date().toLocaleTimeString("fa-IR");
}
function render(){
  var rows=ROWS.filter(function(x){return FILT==="ALL"||x.decision===FILT});
  var c={LONG:0,SHORT:0,WAIT:0}; for(var i=0;i<ROWS.length;i++) c[ROWS[i].decision]++;
  document.getElementById("kLong").textContent=c.LONG;
  document.getElementById("kShort").textContent=c.SHORT;
  document.getElementById("kWait").textContent=c.WAIT;
  if(!rows.length){document.getElementById("list").innerHTML='<div class="card sub">موردی نیست</div>';return}
  var html="";
  for(var i=0;i<rows.length;i++){
    var r=rows[i], up=r.ch>=0;
    html+='<div class="card" data-s="'+r.sym+'">';
    html+='<div class="row"><div><div class="sym">'+r.base+'/USDT</div><div class="name">'+r.name+'</div></div>';
    html+='<div style="text-align:left"><div class="price">'+pf(r.last)+'</div>';
    html+='<div class="chg '+(up?"up":"dn")+'">'+(up?"+":"")+r.ch.toFixed(2)+'٪</div></div></div>';
    html+='<div class="row" style="margin-top:10px"><span class="tag '+r.decision+'">'+r.decision+'</span>';
    html+='<span class="sub">اطمینان '+r.conf+' · امتیاز '+r.score+'</span></div>';
    html+='<div class="bar"><i style="width:'+r.conf+'%"></i></div></div>';
  }
  document.getElementById("list").innerHTML=html;
  var cards=document.querySelectorAll("[data-s]");
  for(var k=0;k<cards.length;k++){
    cards[k].onclick=function(){SEL=this.getAttribute("data-s");showDetail()};
  }
}
function showDetail(){
  var r=null; for(var i=0;i<ROWS.length;i++) if(ROWS[i].sym===SEL) r=ROWS[i];
  if(!r)return;
  var d=document.getElementById("detail"); d.style.display="block";
  var up=r.ch>=0;
  d.innerHTML='<div class="card"><div class="row"><div class="sym">'+r.base+'/USDT</div><span class="tag '+r.decision+'">'+r.decision+'</span></div>'+
    '<div class="price-lg">'+pf(r.last)+'</div>'+
    '<div class="chg '+(up?"up":"dn")+'" style="display:inline-block">'+(up?"+":"")+r.ch.toFixed(2)+'٪ ۲۴ساعته</div>'+
    '<div class="grid2" style="margin-top:12px">'+
    '<div class="mini">بالاترین ۲۴س<b>'+pf(r.high)+'</b></div>'+
    '<div class="mini">پایین‌ترین ۲۴س<b>'+pf(r.low)+'</b></div>'+
    '<div class="mini">اطمینان<b>'+r.conf+'٪</b></div>'+
    '<div class="mini">امتیاز<b>'+r.score+'</b></div></div>'+
    '<p class="sub" style="margin-top:12px">سیگنال بر اساس تغییر ۲۴ساعته. سفارش اجرا نمی‌شود.</p>'+
    '<button class="btn" style="background:#ffffff18;color:#fff" id="btnClose">بستن</button></div>';
  document.getElementById("btnClose").onclick=function(){d.style.display="none"};
  d.scrollIntoView({behavior:"smooth"});
}
document.getElementById("tabs").onclick=function(e){
  var t=e.target.closest("[data-f]"); if(!t)return;
  FILT=t.getAttribute("data-f");
  var tabs=document.querySelectorAll(".tab");
  for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle("on",tabs[i]===t);
  render();
};
document.getElementById("refresh").onclick=load;
load();
setInterval(load,30000);
</script>
</body>
</html>
